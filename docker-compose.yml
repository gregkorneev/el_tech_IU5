services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elteh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elteh"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: ./services/worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/elteh
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [worker]
volumes:
  postgres_data:
